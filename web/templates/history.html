{% extends "base.html" %}
{% block title %}Histórico{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>Histórico</h1>
    <p class="lead-sm">Evolución de CPU, RAM y disco de cada servidor.</p>
  </div>
  <div class="d-flex flex-wrap gap-2 align-items-center">
    <label for="serverSelect" class="visually-hidden">Servidor</label>
    <select id="serverSelect" class="form-select form-select-sm w-auto"></select>
    <div class="btn-group btn-group-sm" role="group" aria-label="Período" id="rangeGroup">
      <button type="button" class="btn btn-outline-info" data-range="1h">1 h</button>
      <button type="button" class="btn btn-outline-info" data-range="6h">6 h</button>
      <button type="button" class="btn btn-outline-info active" data-range="24h">24 h</button>
      <button type="button" class="btn btn-outline-info" data-range="7d">7 días</button>
    </div>
  </div>
</header>

<div id="histEmpty" class="empty d-none"></div>

<div id="histContent">
  <section class="row g-3 mb-4" id="statsRow"></section>

  <section class="panel panel-blue mb-4">
    <div class="panel-head d-flex justify-content-between align-items-center">
      <h2 id="chartTitle">Uso en el tiempo</h2>
      <span class="text-muted small" id="chartMeta"></span>
    </div>
    <div class="panel-body">
      <div id="histChart" class="chart" style="height:380px"></div>
    </div>
  </section>

  <section class="panel panel-purple">
    <div class="panel-head"><h2>Últimas mediciones</h2></div>
    <div class="table-responsive">
      <table class="table table-sm align-middle mb-0">
        <thead>
          <tr><th>Fecha</th><th class="text-end">CPU</th><th class="text-end">RAM</th><th class="text-end">Disco</th><th class="text-end">Uptime</th></tr>
        </thead>
        <tbody id="latestBody"></tbody>
      </table>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
