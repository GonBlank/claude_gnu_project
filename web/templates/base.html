<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101015">
  <script>
    // Activar la entrada antes del primer pintado evita saltos entre páginas.
    try {
      if (sessionStorage.getItem('snmp-navigation-pending') === '1') {
        document.documentElement.classList.add('route-entering');
        sessionStorage.removeItem('snmp-navigation-pending');
      }
    } catch (_) { /* almacenamiento deshabilitado: animación base */ }
  </script>
  <title>{% block title %}Panel{% endblock %} · SNMP Monitor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23506385'/%3E%3Cpath d='M5 8h14M5 12h10M5 16h14' stroke='%23F1F0E1' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#mainContent">Saltar al contenido</a>
  <nav class="topbar" aria-label="Navegación principal">
    <div class="container-xxl topbar-inner">
      <a class="brand" href="{{ url_for('page_dashboard') }}">
        <span class="brand-mark" aria-hidden="true"><i class="bi bi-hdd-network"></i></span>
        <span class="brand-name">SNMP<span class="brand-dim">/</span>MONITOR</span>
      </a>
      <span class="topbar-divider" aria-hidden="true"></span>
      <ul class="nav-links">
        <li><a href="{{ url_for('page_dashboard') }}" class="{{ 'on' if active == 'dashboard' }}" {% if active == 'dashboard' %}aria-current="page"{% endif %}><i class="bi bi-grid-1x2"></i> Panel</a></li>
        <li><a href="{{ url_for('page_servers') }}" class="{{ 'on' if active == 'servers' }}" {% if active == 'servers' %}aria-current="page"{% endif %}><i class="bi bi-hdd-stack"></i> Servidores</a></li>
        <li><a href="{{ url_for('page_settings') }}" class="{{ 'on' if active == 'settings' }}" {% if active == 'settings' %}aria-current="page"{% endif %}><i class="bi bi-sliders2"></i> Configuración</a></li>
      </ul>
      <div class="topbar-meta">
        {% if mock %}
        <span class="system-badge system-demo"><i class="bi bi-flask" aria-hidden="true"></i> DEMO</span>
        {% else %}
        <span class="system-badge system-live"><span class="status-dot" aria-hidden="true"></span> SNMP SYSTEM</span>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container-xxl page" id="mainContent">
    {% block content %}{% endblock %}
  </main>
  <footer class="container-xxl footer-bar"><span>SNMP MONITOR <span class="dim">/</span> INFRASTRUCTURE OBSERVABILITY</span><span>POWERED BY SNMP · MYSQL</span></footer>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
