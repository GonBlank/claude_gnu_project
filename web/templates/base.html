<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Panel{% endblock %} - Lector SNMP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%237db4ea'/%3E%3Crect x='5' y='5' width='14' height='5' rx='1.5' fill='%230d1117'/%3E%3Crect x='5' y='13' width='14' height='5' rx='1.5' fill='%230d1117'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="topbar">
    <div class="container-xxl d-flex align-items-center gap-3 flex-wrap">
      <a class="brand" href="{{ url_for('page_dashboard') }}">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span>Lector SNMP</span>
      </a>
      <ul class="nav-links">
        <li><a href="{{ url_for('page_dashboard') }}" class="{{ 'on' if active == 'dashboard' }}">Panel</a></li>
        <li><a href="{{ url_for('page_servers') }}" class="{{ 'on' if active == 'servers' }}">Servidores</a></li>
        <li><a href="{{ url_for('page_history') }}" class="{{ 'on' if active == 'history' }}">Histórico</a></li>
        <li><a href="{{ url_for('page_settings') }}" class="{{ 'on' if active == 'settings' }}">Configuración</a></li>
      </ul>
      <div class="ms-auto d-flex align-items-center gap-2">
        {% if mock %}
        <span class="pill pill-amber" title="No hay base de datos conectada: los datos son de ejemplo.">
          <i class="bi bi-flask"></i> Datos de ejemplo
        </span>
        {% else %}
        <span class="pill pill-green"><i class="bi bi-database-check"></i> MySQL conectado</span>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container-xxl page">
    {% block content %}{% endblock %}
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
